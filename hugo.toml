baseURL = "https://www.singular.uni-kl.de/"
languageCode = "en-gb"
title = "Singular"
enableRobotsTXT = true
timeZone = "Europe/Berlin"
summaryLength = 40

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "static/Images"
    target = "static/Images"
  [[module.mounts]]
    source = "static/_shared"
    target = "static/_shared"
  [[module.mounts]]
    source = "static/assets"
    target = "static/assets"
  [[module.mounts]]
    source = "static/publications"
    target = "static/publications"

[params]
  description = "Singular is an open-source computer algebra system for polynomial computations."
  siteName = "Singular"
  productionDomain = "www.singular.uni-kl.de"
  oldSitePath = "/old/"
  archivePath = "/old/"
  forumURL = "/old/forum/"
  githubDiscussionsURL = "https://github.com/Singular/Singular/discussions"
  publicationSearchURL = "/publications/search/"
  publicationSubmitURL = "/publications/submit/"
  publicationViewURL = "/publications/view/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    name = "Manual"
    url = "/index.php/singular-manual.html"
    weight = 10
  [[menu.main]]
    name = "Download"
    url = "/index.php/singular-download.html"
    weight = 20
