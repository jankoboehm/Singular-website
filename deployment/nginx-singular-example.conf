# Example production routing for a Hugo-generated Singular site.
# Adjust paths, TLS, PHP/FastCGI/proxy targets, and university policies before use.

server {
    listen 80;
    server_name www.singular.uni-kl.de singular.uni-kl.de;

    # In production, terminate TLS and redirect HTTP to HTTPS as appropriate.
    # return 301 https://www.singular.uni-kl.de$request_uri;

    root /var/www/singular/current;
    index index.html;

    # Keep the complete old website available under /old/. This is server-owned
    # historical content and is not part of the downloaded Hugo artifact.
    location ^~ /old/ {
        root /var/www/singular;
        try_files $uri $uri/ $uri.html =404;
    }

    # Keep FTP/download links at root level for compatibility. This is not
    # copied from old/; point it at the real root-level FTP archive.
    location ^~ /ftp/ {
        root /var/www/singular;
        try_files $uri $uri/ =404;
    }

    # Optional compatibility alias for old manual links that escaped migration.
    location ^~ /Manual/ {
        alias /var/www/singular/old/Manual/;
    }

    # Run the publication notice handler if PHP/FastCGI is enabled.
    location = /publications/submit/notice.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/singular/current/publications/submit/notice.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    # Static Hugo output, including legacy /index.php/...html URLs generated by front matter.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
