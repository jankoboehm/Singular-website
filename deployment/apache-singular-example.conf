# Sketch only: Apache production routing for static Hugo output plus legacy services.
# Adjust paths/modules before use.

<VirtualHost *:80>
    ServerName www.singular.uni-kl.de
    DocumentRoot /var/www/singular/current

    <Directory /var/www/singular/current>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

    # Keep the complete old website available under /old/. This is server-owned
    # historical content and is not part of the downloaded Hugo artifact.
    Alias /old/ /var/www/singular/old/

    <Directory /var/www/singular/old>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

    # Keep FTP/download links at root level for compatibility. This is not
    # copied from old/; point it at the real root-level FTP archive.
    Alias /ftp/ /var/www/singular/ftp/

    # Optional compatibility alias for old manual links that escaped migration.
    Alias /Manual/ /var/www/singular/old/Manual/

    # Configure PHP/FastCGI for /publications/submit/notice.php if publication
    # notices should be handled by this PHP endpoint.
</VirtualHost>
